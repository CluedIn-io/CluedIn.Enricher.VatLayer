name: $(Date:yyyyMMdd)$(Rev:.r)
parameters:
  # Default false, matching the old single-version pipeline's real behaviour (it never set
  # executeIntegrationTests at all, so it always used the template's own false default). The
  # integration tests have a genuine, pre-existing bug unrelated to CluedIn version targeting -
  # VatLayerExternalSearchProvider's only accessible constructor is the public parameterless one,
  # the rest are private, and Castle DynamicProxy (used by BaseExternalSearchTest<T>'s harness)
  # can't generate a proxy subclass calling an inaccessible constructor. Confirmed via the real
  # failure ("Constructor on type 'Castle.Proxies.VatLayerExternalSearchProviderProxy' not found")
  # identically on all three CluedIn legs, including 5.0.0-beta.* - not a version-compat issue, a
  # test that was never exercised by CI before this migration turned it on. See docs/
  # multi-version-targeting-migration.md for the two fix options; leaving it off here rather than
  # guessing which one the repo owner wants.
  - name: runIntegrationTests
    displayName: Run Integration Tests
    type: boolean
    default: false

  - name: pipelineTemplateRef
    displayName: Pipeline Template Ref
    type: string
    default: refs/heads/feature/multi-version-packaging

  # Manual, one-off check that this repo still builds and tests cleanly against a CluedIn.Core
  # version outside multiVersionCluedInTargets below (e.g. a new release, to see if retargeting is
  # needed) - leave blank for a normal run. Its target framework is auto-detected, not supplied
  # here. See crawler.build.jobs.yml's probeCluedInVersion parameter for what this does: on a
  # non-blank value, the entire normal multi-version job graph (including publish) is replaced by a
  # single build+test job for this version, and nothing is published.
  - name: probeCluedInVersion
    displayName: Probe CluedIn Version (leave blank for a normal run)
    type: string
    default: ''

trigger:
  branches:
    include:
    - develop
    - master
    - release/*

pr:
  branches:
    include:
    - develop
    - master
    - release/*

resources:
  repositories:
    - repository: templates
      type: github
      name: CluedIn-io/AzurePipelines.Templates
      endpoint: 'CluedIn-io'
      ref: ${{ parameters.pipelineTemplateRef }}

variables:
  - group: nuget
  - name: testFolderPath
    value: '$(Build.SourcesDirectory)/test'
  - name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
    value: true
  - name: DOTNET_CLI_TELEMETRY_OPTOUT
    value: true
  - name: buildConfiguration
    value: Release

# jobs:, not pool:/steps: - crawler.build.jobs.yml is a jobs template, the only one with
# multi-version support (crawler.build.yml has none).
jobs:
  - template: crawler.build.jobs.yml@templates
    parameters:
      pool:
        vmImage: 'ubuntu-22.04'
      githubReleaseInMaster: true
      publicReleaseForMaster: true
      publishCodeCoverage: true
      useGitVersionDotNetTool: true
      publishToDevFeed: true
      probeCluedInVersion: ${{ parameters.probeCluedInVersion }}
      executeIntegrationTests: ${{ parameters.runIntegrationTests }}
      multiVersionCluedInTargets:
        - cluedInVersion: '4.7.0'
        - cluedInVersion: '4.8.0'
        - cluedInVersion: '5.0.0-beta.*'
